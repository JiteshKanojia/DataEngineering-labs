# Shared Spark configuration for ALL containers (master, worker,
# history server, connect server, jupyter driver, streamlit reader).
#
# Everything here applies cluster-wide, so tune once and every
# service picks it up. This file is bind-mounted to
# /opt/spark/conf/spark-defaults.conf in each container.

# ---- Event logging -> Spark History Server (http://localhost:18080) ----
spark.eventLog.enabled           true
spark.eventLog.dir               /data/spark-events
spark.history.fs.logDirectory    /data/spark-events
spark.ui.retainedTasks           1000
spark.sql.ui.explainMode         formatted

# ---- Lakehouse storage (local FS lake, S3-swappable later) ----
spark.sql.warehouse.dir          /data/warehouse

# ---- Delta Lake support (jars are baked into the image) ----
spark.sql.extensions             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog  org.apache.spark.sql.delta.catalog.DeltaCatalog

# ---- Driver memory ----
# Deliberately NOT set here: driver heap comes from the SPARK_DRIVER_MEMORY env var
# (see JUPYTER_DRIVER_MEMORY in .env; spark-submit prefers this file over the env when
# both exist, so hard-coding it here would kill the .env knob).
# Spark services pass their own memory explicitly (connect: --driver-memory in
# docker-compose.yml; master/worker/history: SPARK_*_MEMORY envs).

# ---- Defaults that are ON in Spark 4.x (kept explicit for teaching) ----
# ANSI mode is the default since Spark 4.0. You can turn it off here:
# spark.sql.ansi.enabled        false
# AQE is the default since 3.2; these are the knobs you will tune in nb03:
# spark.sql.adaptive.coalescePartitions.enabled        true
# spark.sql.adaptive.skewJoin.enabled                  true

# ---- Logging (quieter than the default INFO storm) ----
spark.driver.extraJavaOptions    -Dlog4j.configurationFile=file:/opt/spark/conf/log4j2.properties
